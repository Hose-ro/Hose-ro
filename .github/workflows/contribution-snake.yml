name: Serpiente de contribuciones

on:
  workflow_dispatch:
  schedule:
    - cron: '27 10 * * *'

permissions:
  contents: write

concurrency:
  group: contribution-snake

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Generar las animaciones
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            ${{ runner.temp }}/snake-light.svg?palette=github-light&color_snake=#0969da
            ${{ runner.temp }}/snake-dark.svg?palette=github-dark&color_snake=#55d9f2
      - name: Publicar en la rama output
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$(git ls-remote --heads origin refs/heads/output)" ]]; then
            git fetch --depth=1 origin refs/heads/output
            git switch --detach FETCH_HEAD
          else
            git switch --orphan output
          fi

          cp "$RUNNER_TEMP/snake-light.svg" "$RUNNER_TEMP/snake-dark.svg" .
          git add snake-light.svg snake-dark.svg
          if git diff --cached --quiet; then
            exit 0
          fi

          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Actualiza la serpiente de contribuciones'
          git push origin HEAD:refs/heads/output
